<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Client info · expose</title>
<script>try{var theme=localStorage.getItem('expose-theme');if(theme&&theme!=='auto')document.documentElement.dataset.theme=theme}catch(_){}</script>
<style>@@CSS@@</style>
</head>
<body>
<header class="top"><a class="brand" href="/" aria-label="Expose overview"><span class="logo" aria-hidden="true">{{LOGO}}</span><span class="word">expose</span></a><div class="top-spacer"></div><a class="btn ghost sm" href="/">Back to session</a></header>
<main class="client-main">
  <div class="page-head"><div><h1>Client info</h1><p>Connection details reported by the server and your browser.</p></div></div>
  <h2>Connection</h2><table aria-label="Connection details">{{ROWS}}</table>
  <details><summary>Browser and device details</summary><div id="fp"></div></details>
</main>
<script>{{FPJS}}</script>
</body>
</html>
