name: Repository checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: stable
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.x'
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y stow ripgrep zsh proxychains4 openssl
          python -m venv .venv
          .venv/bin/pip install flask
      - name: Reject credentials in public files
        run: .venv/bin/python scripts/check-secrets.py
      - name: Check installer and repeated deployment
        run: |
          bash tests/install-packages.sh
          bash tests/online-config.sh
          bash tests/quickemu.sh
          bash tests/update-check.sh
          .venv/bin/python tests/deployment.py
          .venv/bin/python tests/internetshare.py
          .venv/bin/python tests/gnome.py
          .venv/bin/python tests/secret-checks.py
          .venv/bin/python tests/sync.py
          zsh -n zsh/.zshrc zsh/.zshenv
      - name: Build and test expose and all connectors
        run: |
          make -C expose console-clients test
          cd expose/src/connector
          go test ./...
          go vet ./...
