<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f7" />
  <title>Internet Share</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="page">
    <header class="app-header">
      <div class="glyph" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M12 4a16 16 0 0 0-9 2.8l1.3 1.6A14 14 0 0 1 12 5.6a14 14 0 0 1 7.7 2.8L21 6.8A16 16 0 0 0 12 4Zm0 5a10 10 0 0 0-5.6 1.7l1.3 1.6A8 8 0 0 1 12 10.9a8 8 0 0 1 4.3 1.4l1.3-1.6A10 10 0 0 0 12 9Zm0 5a4.2 4.2 0 0 0-2.3.7l1.3 1.6a2 2 0 0 1 2 0l1.3-1.6A4.2 4.2 0 0 0 12 14Zm0 3.6a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z" fill="currentColor"/>
        </svg>
      </div>
      <h1>Internet Share</h1>
      <p class="tagline">Ad-hoc networks in a couple of taps.</p>
    </header>

    <main id="app">
      <div class="loading">Loading…</div>
    </main>

    <footer class="app-footer">
      <span id="root-note"></span>
    </footer>
  </div>

  <!-- Toasts -->
  <div id="toasts" class="toasts" role="status" aria-live="polite"></div>

  <!-- Overlay sheet -->
  <div id="sheet" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div id="sheet-body"></div>
    </div>
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
